spring.datasource.url=jdbc:h2:mem:finance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.path=/h2-console
spring.flyway.enabled=true
spring.flyway.locations=db/migration/h2
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=CORE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=DEBUG

# Exchange rates provider
exchangerates.api.url=https://api.exchangeratesapi.io/v1/latest
exchangerates.api.key=REPLACE_WITH_YOUR_API_KEY

# JWT Configuration (local dev only — use strong secret in production)
jwt.secret=c2VjdXJlLWxvY2FsLWRldi1zZWNyZXQta2V5LWZvci1tb25leS1rZWVwZXItYXBwbGljYXRpb24tMjAyNg==
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Allow circular references for auth module
spring.main.allow-circular-references=true
